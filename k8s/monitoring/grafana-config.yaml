apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-config
data:
  prometheus.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        uid: prometheus-ds
        editable: false
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'Campus Events'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        updateIntervalSeconds: 10
        options:
          path: /var/lib/grafana/dashboards
