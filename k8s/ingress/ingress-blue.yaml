apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: campus-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$1
spec:
  rules:
  - http:
      paths:
      - path: /api/users/?(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: user-service-blue
            port:
              number: 8000
      - path: /api/registrations/?(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: registration-service
            port:
              number: 8000
