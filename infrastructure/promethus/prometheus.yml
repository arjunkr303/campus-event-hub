global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'event-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['event-service:8000']

  - job_name: 'registration-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['registration-service:8000']