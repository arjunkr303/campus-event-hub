services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-campus_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-campus_pass}
      POSTGRES_DB: ${POSTGRES_DB:-campus_event_hub}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-campus_user}"]
      interval: 5s
      timeout: 5s
      retries: 5

  nginx:
    build:
      context: ./infrastructure/nginx
      dockerfile: dockerfile
    container_name: nginx
    ports:
      - "8000:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - event-service
      - registration-service
      - user-service
      - notification-service

  user-service:
    build: 
      context: ./user-service
      dockerfile: dockerfile
    container_name: user-service
    ports:
      - "8001:8000"
    env_file:
      - ./user-service/.env
    volumes:
      - ./user-service:/app
      - /app/venv
    depends_on:
      postgres:
        condition: service_healthy

  event-service:
    build:
      context: ./event-service
      dockerfile: dockerfile
    container_name: event-service
    ports:
      - "8002:8000"
    env_file:
      - ./event-service/.env
    volumes:
      - ./event-service:/app
      - /app/venv
    depends_on:
      postgres:
        condition: service_healthy

  registration-service:
    build:
      context: ./registration-service
      dockerfile: dockerfile
    container_name: registration-service
    ports:
      - "8003:8000"
    env_file:
      - ./registration-service/.env
    volumes:
      - ./registration-service:/app
      - /app/venv
    depends_on:
      postgres:
        condition: service_healthy

  notification-service:
    build: 
      context: ./notification-service
      dockerfile: dockerfile
    container_name: notification-service
    ports:
      - "8004:8000"
    env_file:
      - ./notification-service/.env
    volumes:
      - ./notification-service:/app
    depends_on:
      postgres:
        condition: service_healthy

  
  kafka:
    image: apache/kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://127.0.0.1:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0 


  kafka_ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8088:8080"
    environment:
      DYNAMIC_CONFIG_ENABLED: "true"
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on: 
      - kafka 

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports: 
      - "9090:9090"
    volumes:
      - ./infrastructure/promethus/prometheus.yml:/etc/prometheus/prometheus.yml
    command: 
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    depends_on:
      - kafka

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  postgres-data:
  grafana-storage: